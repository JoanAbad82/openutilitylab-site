version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:30"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    groups:
      routine-action-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
