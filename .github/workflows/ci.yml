name: public-site-validation

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.25.1"
      - name: Validate public site repository
        run: python scripts/verify_public_site.py
      - name: Validate affiliate friction score direction and boundaries
        run: python scripts/validate-local-html-friction-scoring.py
      - name: Check valid and adversarial agent schema fixtures
        run: python -m unittest discover -s tests -p test_agents_schema.py -v
      - name: Test verified GitHub profile bridge, including invalid/stale input
        run: python -m unittest discover -s tests -p test_profile_pulse_bridge.py -v
      - name: Validate light/dark site-theme integration on all routes
        run: python -m unittest discover -s tests -p test_site_theme.py -v
      - name: Validate authentic showcase screenshots and evidence hashes
        run: python -m unittest discover -s tests -p test_verified_showcase.py -v
