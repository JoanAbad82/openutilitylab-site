name: refresh-agent-task-index

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.25.1"

      - name: Generate live agent task index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update-agent-task-index.py

      - name: Refresh read-only profile pulse snapshot
        run: python scripts/profile_pulse_bridge.py --refresh

      - name: Validate repository
        run: python scripts/verify_public_site.py

      - name: Commit only verified snapshot changes
        run: |
          git add -- tasks.json data/profile-pulse.json
          if git diff --cached --quiet; then
            echo "PUBLIC_INDICES_UNCHANGED=YES"
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh verified public evidence indices"
          git push origin HEAD:main
